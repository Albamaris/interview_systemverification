name: Gauge Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Läuft täglich um 02:00 UTC (unabhängig von Pushes) — z.B. um
    # Umgebungs-/Drittanbieter-Drift (Browser-Updates, Ziel-Website-Änderungen)
    # frühzeitig zu erkennen, auch wenn niemand Code geändert hat.
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Erlaubt manuelles Auslösen über den "Run workflow"-Button im Actions-Tab
    # (praktisch, um den Schedule-Lauf zu testen, ohne zu warten)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gauge-playwright-demo .

      - name: Run tests in container
        run: docker run --rm -v ${{ github.workspace }}/reports:/app/reports gauge-playwright-demo

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauge-html-report
          path: reports/html-report
